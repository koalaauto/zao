##
# HTTP：只留 ACME 验证，其余 301 到 https 主域
server {
    listen      80;
    server_name zaoaoaoaoao.com www.zaoaoaoaoao.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://zaoaoaoaoao.com$request_uri;
    }

    access_log  /var/log/nginx/access.zaoaoaoaoao.com.log;
    error_log   /var/log/nginx/error.zaoaoaoaoao.com.log error;
}

server {
    listen      443 ssl http2;

    # HTTPS（Let's Encrypt，certbot webroot 自动续期，deploy hook 自动 reload）
    ssl_certificate     /etc/letsencrypt/live/zaoaoaoaoao.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaoaoaoaoao.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    server_name zaoaoaoaoao.com www.zaoaoaoaoao.com;
    root        /var/www/zao/public;
    index       index.php;

    # 禁止特定 UA 的访问
    if ($http_user_agent ~* "DotBot|AhrefsBot|XoviBot|SemrushBot|YandexBot|AlphaBot|Uptimebot|MJ12bot|spbot|MegaIndex|YandexImages|Yahoo! Slurp|YisouSpider|MauiBot|BLEXBot|Go-http-client|Baiduspider-render") {
        return 403;
    }

    # www 域名跳转 
    if ($host = 'www.zaoaoaoaoao.com' ) {
        rewrite ^/(.*)$ $scheme://zaoaoaoaoao.com/$1 permanent;
    }

    # Let's Encrypt HTTP-01 challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    # 主站入口
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # 重定向，programs -> program
    location ^~ /programs/ {
        rewrite ^/programs/(.*)$  $scheme://$host/program/$1 permanent;
    }

    # 静态缓存
    location ~ \.(woff|css|js|swf)(.*) {
        expires 1d;
    }

    # 静态合并
    location ^~ /static/ {
        concat on;
        concat_types text/css application/javascript;
        concat_max_files 30;
        # 静态资源浏览器缓存 7 天（原先被这个 ^~ 前缀吃掉，上面的 expires 从未生效）
        expires 7d;

        # Bing 封面每天换图但文件名不变，只缓存 1 小时
        location ^~ /static/img/cover/ {
            expires 1h;
        }
    }

    # 服务器在国内连不上 disqus.com，简易评论框的后端 API 必然超时：直接快速失败，
    # 不进 php-fpm（只有 5 个进程，被 Disqus 超时占满会拖垮全站）。海外访客走 Disqus 原生评论框不受影响
    location ^~ /disqus/api/ {
        default_type application/json;
        return 503 '{"code":-1,"response":"Disqus is unreachable from this server"}';
    }

    location ~ \.php$ {
        fastcgi_pass    127.0.0.1:9000;
        fastcgi_param   SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include         fastcgi_params;
    }

    access_log  /var/log/nginx/access.zaoaoaoaoao.com.log;
    error_log   /var/log/nginx/error.zaoaoaoaoao.com.log error;
}
